[package]
name = "data_generation"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
half = "2.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
ndarray = "0.16"
ndarray-npy = "0.9"
rand = "0.8"
renderer = { path = "../renderer" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
